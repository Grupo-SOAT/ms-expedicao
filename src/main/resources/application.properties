server.port=8083
spring.application.name=ms-expedicao

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

app.dynamodb.region=${AWS_REGION:us-east-1}
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
app.dynamodb.table=${DYNAMODB_TABLE:execution}
app.dynamodb.queue-index=${DYNAMODB_QUEUE_INDEX:GSI1}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-expedicao-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.events.topic.service-order=${APP_EVENTS_TOPIC_SERVICE_ORDER:service-order-events}
app.events.topic.payment=${APP_EVENTS_TOPIC_PAYMENT:payment-events}
app.events.topic.execution=${APP_EVENTS_TOPIC_EXECUTION:execution-events}
